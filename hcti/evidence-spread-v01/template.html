<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--signal:#3497FF;--gold:#C79A58;--ivory:#F1EEE6;--navy:#0B1723;--slate:#182938;--black:#080A0C}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}body{background:var(--black);font-family:Inter,Arial}.frame{position:relative;width:1080px;height:1350px;background:var(--navy);color:var(--ivory);padding:56px 58px}.top{display:flex;justify-content:space-between;color:var(--signal);font:800 20px/1 Manrope;text-transform:uppercase;letter-spacing:.06em}.brand:after{content:"";display:block;width:46px;height:4px;background:var(--signal);margin-top:14px}.claim{position:absolute;left:58px;top:165px;width:900px;font:700 68px/.96 'Cormorant Garamond';letter-spacing:-.028em}.claim .accent{color:var(--signal)}.source-shell{position:absolute;left:58px;top:390px;width:620px;height:650px;background:rgba(241,238,230,.97);padding:26px;box-shadow:0 20px 65px rgba(0,0,0,.28)}.source-image{width:100%;height:100%;background:url('{{source_image}}') center/contain no-repeat}.detail{position:absolute;right:58px;top:510px;width:330px;height:330px;border:7px solid var(--ivory);background:#fff url('{{detail_image}}') center/cover no-repeat;box-shadow:0 18px 50px rgba(0,0,0,.42)}.detail-label{position:absolute;right:58px;top:856px;width:330px;color:var(--signal);font:800 16px/1.15 Manrope;text-transform:uppercase;letter-spacing:.04em}.interpretation{position:absolute;right:58px;top:930px;width:330px;font:600 23px/1.32 Manrope;color:rgba(241,238,230,.94)}.provenance{position:absolute;left:58px;bottom:42px;font:600 14px/1 Inter;text-transform:uppercase;letter-spacing:.05em;color:rgba(241,238,230,.72)}.source-label{position:absolute;left:58px;top:350px;color:var(--gold);font:800 16px/1 Manrope;text-transform:uppercase;letter-spacing:.05em}
.frame.claim_first .claim{top:190px;width:560px;font-size:76px}.frame.claim_first .source-shell{left:600px;top:180px;width:420px;height:680px}.frame.claim_first .detail{left:80px;right:auto;top:700px;width:360px;height:300px}.frame.claim_first .detail-label{left:80px;right:auto;top:1015px;width:360px}.frame.claim_first .interpretation{left:520px;right:auto;top:930px;width:500px;font-size:25px}.frame.claim_first .source-label{left:600px;top:140px}
.frame.detail_first .claim{top:765px;width:900px;font-size:64px}.frame.detail_first .source-shell{left:58px;top:160px;width:420px;height:520px;opacity:.62}.frame.detail_first .detail{right:58px;top:150px;width:500px;height:500px}.frame.detail_first .detail-label{right:58px;top:665px;width:500px}.frame.detail_first .interpretation{left:58px;right:auto;top:980px;width:820px;font-size:26px}.frame.detail_first .source-label{left:58px;top:125px}
</style></head><body><main class="frame {{mode}}"><header class="top"><div class="brand">INTRST FILMS</div><div>{{eyebrow}}</div></header><div class="source-label">{{source_label}}</div><h1 class="claim">{{claim}}</h1><div class="source-shell"><div class="source-image"></div></div><div class="detail"></div><div class="detail-label">{{detail_label}}</div><div class="interpretation">{{interpretation}}</div><div class="provenance">{{provenance}}</div></main></body></html>
