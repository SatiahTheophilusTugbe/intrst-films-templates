<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
:root{--paper:#F1EEE6;--ink:#202322;--crimson:#B8424E;--copper:#D79A71}
*{box-sizing:border-box}body{margin:0;width:1080px;height:1350px;background:var(--paper);color:var(--ink)}.frame{position:relative;width:1080px;height:1350px;padding:54px 60px;font-family:Inter}
.top{display:flex;justify-content:space-between;font:800 24px/1.2 Manrope;letter-spacing:.04em}.brand{color:var(--crimson)}.subject{font-size:24px;color:#555850}
.top-rule{height:2px;background:var(--ink);margin-top:26px}.eyebrow{position:absolute;left:60px;top:127px;font:700 20px/1.2 Manrope;color:var(--crimson);letter-spacing:.09em}.claim{position:absolute;left:56px;top:171px;margin:0;max-width:960px;font:800 69px/1.08 Manrope;letter-spacing:-.055em}.claim em{font-style:normal;color:var(--crimson)}
.source-block{position:absolute;left:60px;top:381px;width:624px}.source-label{font:700 21px/1.3 Inter;letter-spacing:.03em;padding-bottom:16px;border-bottom:1px solid #9C9B94}.source-photo{display:block;width:624px;height:419px;object-fit:contain;margin-top:20px}.source-caption{padding:20px 0;font:500 22px/1.35 Inter;color:#5C5E57}
.meaning{position:absolute;left:744px;right:60px;top:382px;border-top:5px solid var(--crimson);padding-top:22px}.label{font:800 22px/1.2 Manrope;letter-spacing:.08em;color:var(--crimson)}.interpretation{font:600 39px/1.12 'Cormorant Garamond';margin:24px 0}.scope{font:400 23px/1.4 Inter;color:#555850}.date{font:800 43px/1 Manrope;letter-spacing:-.05em;margin:24px 0 10px}
.detail-block{position:absolute;left:60px;right:60px;top:1000px;border-top:2px solid var(--ink);padding-top:18px;display:grid;grid-template-columns:180px 1fr;gap:22px}.detail-tag{font:800 22px/1.35 Manrope;color:var(--crimson)}.detail-caption{position:relative;background:#fff;padding:14px 18px 12px}.detail-caption img{display:block;width:100%;height:auto}.highlight{position:absolute;left:41%;right:8%;top:40%;height:20%;background:rgba(184,66,78,.15);border-bottom:2px solid var(--copper);pointer-events:none}.detail-note{font:400 20px/1.3 Inter;color:#555850;margin-top:12px}
.footer{position:absolute;left:60px;right:60px;bottom:40px;display:flex;justify-content:space-between;align-items:end;border-top:1px solid #9C9B94;padding-top:20px}.series{font:800 27px/1 Manrope;letter-spacing:.06em;color:var(--crimson)}.provenance{max-width:620px;text-align:right;font:500 20px/1.4 Inter;color:#555850}
</style></head><body><main class="frame"><header class="top"><div class="brand">INTRST FILMS</div><div class="subject">{{subject}}</div></header><div class="top-rule"></div><div class="eyebrow">{{eyebrow}}</div><h1 class="claim">{{claim_html}}</h1><section class="source-block"><div class="source-label">{{source_label}}</div><img class="source-photo" src="{{source_image}}"><div class="source-caption">{{source_context}}</div></section><aside class="meaning"><div class="label">WHAT IT SHOWS</div><p class="interpretation">{{interpretation}}</p><div class="scope">{{scope_note}}</div><div class="date">{{date_label}}</div><div class="scope">{{date_context}}</div></aside><section class="detail-block"><div class="detail-tag">THE DETAIL<br>THAT MATTERS</div><div><div class="detail-caption"><img src="{{detail_image}}"><div class="highlight"></div></div><div class="detail-note">{{detail_note}}</div></div></section><footer class="footer"><div class="series">THE PROOF</div><div class="provenance">{{provenance}}</div></footer></main></body></html>
