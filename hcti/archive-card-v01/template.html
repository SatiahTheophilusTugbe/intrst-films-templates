<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--signal:#3497FF;--gold:#C79A58;--ivory:#F1EEE6;--navy:#0B1723;--black:#080A0C}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}body{background:var(--black);font-family:Inter,Arial}.frame{position:relative;width:1080px;height:1350px;background:var(--navy);color:var(--ivory);padding:56px 58px}.top{display:flex;justify-content:space-between;color:var(--signal);font:800 20px/1 Manrope;letter-spacing:.06em;text-transform:uppercase}.brand:after{content:"";display:block;width:46px;height:4px;background:var(--signal);margin-top:14px}.artifact-shell{position:absolute;left:58px;right:58px;top:170px;height:760px;display:flex;align-items:center;justify-content:center;background:rgba(241,238,230,.96);box-shadow:0 25px 70px rgba(0,0,0,.25)}.artifact{width:92%;height:92%;background:url('{{artifact_image}}') center/contain no-repeat}.detail{display:{{detail_display}};position:absolute;right:74px;top:725px;width:290px;height:290px;background:#fff url('{{detail_image}}') center/cover no-repeat;border:8px solid var(--ivory);box-shadow:0 18px 45px rgba(0,0,0,.4)}.detail-label{display:{{detail_display}};position:absolute;right:74px;top:1028px;color:var(--signal);font:800 15px/1.1 Manrope;text-transform:uppercase;letter-spacing:.05em}.copy{position:absolute;left:58px;right:58px;bottom:92px}.archive-label{color:var(--gold);font:800 19px/1 Manrope;text-transform:uppercase;margin-bottom:18px}.headline{max-width:820px;margin:0;font:700 66px/.96 'Cormorant Garamond';letter-spacing:-.025em}.caption{max-width:760px;margin-top:20px;font:500 24px/1.34 Manrope;color:rgba(241,238,230,.92)}.provenance{position:absolute;left:58px;bottom:42px;font:600 14px/1 Inter;color:rgba(241,238,230,.72);text-transform:uppercase;letter-spacing:.05em}.frame.artifact_interpretation .artifact-shell{right:390px;height:690px}.frame.artifact_interpretation .copy{left:560px;top:300px;bottom:auto;width:450px}.frame.artifact_interpretation .headline{font-size:58px}.frame.artifact_interpretation .caption{font-size:22px}.frame.artifact_interpretation .detail{left:130px;right:auto;top:740px;width:300px;height:300px}.frame.artifact_interpretation .detail-label{left:130px;right:auto;top:1055px}
</style></head><body><main class="frame {{mode}}"><header class="top"><div class="brand">INTRST FILMS</div><div>{{archive_label}}</div></header><div class="artifact-shell"><div class="artifact"></div></div><div class="detail"></div><div class="detail-label">{{detail_label}}</div><section class="copy"><div class="archive-label">{{kicker}}</div><h1 class="headline">{{headline}}</h1><div class="caption">{{micro_caption}}</div></section><div class="provenance">{{provenance}}</div></main></body></html>
