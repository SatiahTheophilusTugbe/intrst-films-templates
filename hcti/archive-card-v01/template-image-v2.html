<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--signal:#4FA99A;--gold:#B89355;--ivory:#F1EEE6;--navy:#0B1723;--black:#080A0C}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}body{background:var(--black);font-family:Inter,Arial}.frame{position:relative;width:1080px;height:1350px;background:var(--navy);color:var(--ivory);padding:56px 58px}.top{display:flex;justify-content:space-between;color:var(--signal);font:800 20px/1 Manrope;letter-spacing:.06em;text-transform:uppercase}.brand:after{content:"";display:block;width:46px;height:4px;background:var(--signal);margin-top:14px}.artifact-shell{position:absolute;left:58px;right:58px;top:170px;height:760px;display:flex;align-items:center;justify-content:center;background:rgba(241,238,230,.96);box-shadow:0 25px 70px rgba(0,0,0,.25)}.artifact{width:92%;height:92%;}.detail{display:{{detail_display}};position:absolute;right:74px;top:725px;width:290px;height:290px;background:#fff;border:8px solid var(--ivory);box-shadow:0 18px 45px rgba(0,0,0,.4)}.detail-label{display:{{detail_display}};position:absolute;right:74px;top:1028px;color:var(--signal);font:800 15px/1.1 Manrope;text-transform:uppercase;letter-spacing:.05em}.copy{position:absolute;left:58px;right:58px;bottom:92px}.archive-label{color:var(--gold);font:800 19px/1 Manrope;text-transform:uppercase;margin-bottom:18px}.headline{max-width:820px;margin:0;font:700 66px/.96 'Cormorant Garamond';letter-spacing:-.025em}.caption{max-width:760px;margin-top:20px;font:500 24px/1.34 Manrope;color:rgba(241,238,230,.92)}.provenance{position:absolute;left:58px;bottom:42px;font:600 14px/1 Inter;color:rgba(241,238,230,.72);text-transform:uppercase;letter-spacing:.05em}.frame.artifact_interpretation .artifact-shell{right:390px;height:690px}.frame.artifact_interpretation .copy{left:560px;top:300px;bottom:auto;width:450px}.frame.artifact_interpretation .headline{font-size:58px}.frame.artifact_interpretation .caption{font-size:22px}.frame.artifact_interpretation .detail{left:130px;right:auto;top:740px;width:300px;height:300px}.frame.artifact_interpretation .detail-label{left:130px;right:auto;top:1055px}

/* Archive v2: source-led editorial composition. */
.frame{padding:56px 60px;background:#0A1819}
.frame.plum{--signal:#BF9CAB;--gold:#D79A71;background:#21151F}
.top{position:relative;z-index:4;font-size:26px}
.artifact-shell{left:360px;right:-90px;top:0;height:885px;background:none;box-shadow:none;opacity:1}
.artifact{width:100%;height:100%;background-size:cover;background-position:48% 20%}
.frame:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0A1819 0px,#0A1819 380px,rgba(10,24,25,.92) 425px,rgba(10,24,25,.42) 515px,transparent 620px),linear-gradient(180deg,transparent 0px,transparent 670px,rgba(10,24,25,.3) 765px,#0A1819 885px);pointer-events:none}
.frame.plum:after{background:linear-gradient(90deg,#21151F 2%,rgba(33,21,31,.88) 27%,transparent 75%),linear-gradient(0deg,#21151F 28%,transparent 74%)}
.copy{left:60px;right:60px;bottom:194px;z-index:3}
.archive-label{font-size:26px;margin-bottom:22px;letter-spacing:.055em}
.headline{font-size:116px;line-height:.92;max-width:920px}
.caption{font-size:31px;line-height:1.35;max-width:875px;margin-top:25px}
.source-extract{position:absolute;z-index:3;left:60px;top:202px;width:535px;border-left:3px solid var(--signal);padding:0 0 0 26px}
.extract-label{font:700 19px/1.5 Manrope;color:var(--signal);letter-spacing:.06em;text-transform:uppercase}
.quote{font:600 62px/1.08 'Cormorant Garamond';margin:26px 0;color:var(--ivory)}
.quote em{font-style:normal;border-bottom:3px solid var(--gold)}
.extract-source{font:500 20px/1.45 Inter;color:rgba(241,238,230,.72)}
.record-rule{width:88px;height:3px;background:var(--gold);margin-bottom:30px}
.publication{position:absolute;bottom:56px;left:60px;z-index:3;font:800 26px/1.2 Manrope;letter-spacing:.055em;color:var(--signal)}
.provenance{z-index:3;left:auto;right:60px;bottom:56px;width:500px;text-align:right;font-size:17px;line-height:1.4;letter-spacing:0;text-transform:none}
.detail,.detail-label{display:none}
/* Semantic image binding v2; crop geometry v1; approved design tokens unchanged. */
.artifact .image-layer{display:block;width:100%;height:100%;object-fit:cover;object-position:48% 20%}.detail img{width:100%;height:100%;object-fit:cover}
</style></head><body><main class="frame {{mode}}"><header class="top"><div class="brand">INTRST FILMS</div><div>{{subject}}</div></header><div class="artifact-shell"><div class="artifact"><img src="{{artifact_image}}" alt="" class="image-layer"></div></div><div class="detail"></div><div class="detail-label">{{detail_label}}</div><aside class="source-extract"><div class="extract-label">{{source_type}} · {{date_label}}</div><div class="quote">{{excerpt_html}}</div><div class="extract-source">{{excerpt_attribution_html}}</div></aside><section class="copy"><div class="record-rule"></div><div class="archive-label">{{kicker}}</div><h1 class="headline">{{headline}}</h1><div class="caption">{{micro_caption}}</div></section><div class="publication">FROM THE RECORD</div><div class="provenance">{{provenance}}</div></main></body></html>
