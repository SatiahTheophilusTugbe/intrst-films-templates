<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--signal:#3497FF;--gold:#C79A58;--ivory:#F1EEE6;--navy:#0B1723;--slate:#182938;--black:#080A0C;--x:{{image_position_x}};--y:{{image_position_y}}}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:var(--black)}body{font-family:Inter,Arial,sans-serif}.frame{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--navy);color:var(--ivory)}
.photo{position:absolute;inset:0;background:url('{{background_image}}') var(--x) var(--y)/cover no-repeat;filter:saturate(1.06) contrast(1.08) brightness(1.02)}
.gloss{position:absolute;inset:0;background:radial-gradient(ellipse at 85% 12%,rgba(255,255,255,.15),transparent 34%),radial-gradient(circle at -5% 40%,rgba(52,151,255,.32),transparent 43%);mix-blend-mode:screen}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,12,.78),rgba(11,23,35,.45) 42%,rgba(8,10,12,.08) 74%),linear-gradient(0deg,rgba(8,10,12,.68),transparent 58%)}
.top{position:absolute;top:52px;left:58px;right:58px;display:flex;justify-content:space-between;color:var(--signal);font:800 20px/1 Manrope;letter-spacing:.06em;text-transform:uppercase}.brand:after{content:"";display:block;width:46px;height:4px;background:var(--signal);margin-top:14px;border-radius:2px}.index{opacity:.92}
.copy{position:absolute;left:58px;right:58px;bottom:112px;max-width:830px}.kicker{color:var(--gold);font:800 20px/1.05 Manrope;text-transform:uppercase;margin-bottom:22px}.headline{font:700 86px/.91 'Cormorant Garamond';letter-spacing:-.035em;margin:0;color:var(--ivory)}.headline .accent{color:var(--signal)}.support{margin-top:26px;max-width:720px;font:500 27px/1.32 Manrope;color:rgba(241,238,230,.95)}.mini{margin-top:22px;font:700 20px/1.25 Manrope;color:var(--signal)}
.source{position:absolute;left:58px;bottom:42px;font:600 14px/1 Inter;letter-spacing:.05em;text-transform:uppercase;color:rgba(241,238,230,.78)}
.frame.split_editorial{background:var(--navy)}.frame.split_editorial .photo{left:44%;}.frame.split_editorial .gloss{left:44%}.frame.split_editorial .scrim{background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 43%,rgba(11,23,35,.86) 50%,rgba(8,10,12,.08) 82%)}.frame.split_editorial .copy{width:520px;right:auto}.frame.split_editorial .headline{font-size:72px}.frame.split_editorial .support{font-size:24px}
.frame.object_led .photo{opacity:.34}.frame.object_led .object{display:block}.object{display:none;position:absolute;right:72px;top:215px;width:430px;height:700px;background:url('{{object_image}}') center/contain no-repeat;filter:drop-shadow(0 25px 45px rgba(0,0,0,.42))}.frame.object_led .copy{width:560px}.frame.object_led .headline{font-size:76px}
.frame.evidence_led .photo{opacity:.22}.frame.evidence_led .copy{width:510px}.frame.evidence_led .headline{font-size:70px}.frame.evidence_led .object{display:block;right:56px;top:180px;width:470px;height:850px;background-color:#F1EEE6;background-size:contain;background-repeat:no-repeat}
.frame.closing .scrim{background:linear-gradient(0deg,rgba(8,10,12,.86),rgba(11,23,35,.20) 56%,rgba(8,10,12,.06))}.frame.closing .copy{max-width:890px}.cta{display:{{cta_display}};margin-top:30px;color:var(--signal);font:800 20px/1.2 Manrope;text-transform:uppercase}.handle{display:{{cta_display}};margin-top:10px;color:var(--ivory);font:700 17px/1.2 Manrope;letter-spacing:.05em}
</style></head><body><main class="frame {{visual_mode}}"><div class="photo"></div><div class="gloss"></div><div class="scrim"></div><div class="object"></div><header class="top"><div class="brand">INTRST FILMS</div><div class="index">{{eyebrow}} &nbsp; {{slide_number}}/7</div></header><section class="copy"><div class="kicker">{{kicker}}</div><h1 class="headline">{{headline_html}}</h1><div class="support">{{support_copy}}</div><div class="mini">{{mini_hook}}</div><div class="cta">{{cta_text}}</div><div class="handle">{{handle_text}}</div></section><div class="source">{{source_line}}</div></main></body></html>
