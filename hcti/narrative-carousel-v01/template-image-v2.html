<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
:root{--signal:#F06F61;--gold:#E6B85C;--ivory:#F1EEE6;--navy:#0B1723;--slate:#182938;--black:#080A0C;--x:{{image_position_x}};--y:{{image_position_y}}}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:var(--black)}body{font-family:Inter,Arial,sans-serif}.frame{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--navy);color:var(--ivory)}
.photo{position:absolute;inset:0;filter:none}
.gloss{position:absolute;inset:0;background:radial-gradient(ellipse at 85% 12%,rgba(255,255,255,.15),transparent 34%),radial-gradient(circle at -5% 40%,rgba(240,111,97,.18),transparent 43%);mix-blend-mode:screen}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,12,.78),rgba(11,23,35,.45) 42%,rgba(8,10,12,.08) 74%),linear-gradient(0deg,rgba(8,10,12,.68),transparent 58%)}
.top{position:absolute;top:52px;left:58px;right:58px;display:flex;justify-content:space-between;color:var(--signal);font:800 20px/1 Manrope;letter-spacing:.06em;text-transform:uppercase}.brand:after{content:"";display:block;width:46px;height:4px;background:var(--signal);margin-top:14px;border-radius:2px}.index{opacity:.92}
.copy{position:absolute;left:58px;right:58px;bottom:112px;max-width:830px}.kicker{color:var(--gold);font:800 20px/1.05 Manrope;text-transform:uppercase;margin-bottom:22px}.headline{font:700 86px/.91 'Cormorant Garamond';letter-spacing:-.035em;margin:0;color:var(--ivory)}.headline .accent{color:var(--signal)}.support{margin-top:26px;max-width:720px;font:500 27px/1.32 Manrope;color:rgba(241,238,230,.95)}.mini{margin-top:22px;font:700 20px/1.25 Manrope;color:var(--signal)}
.source{position:absolute;left:58px;bottom:42px;font:600 14px/1 Inter;letter-spacing:.05em;text-transform:uppercase;color:rgba(241,238,230,.78)}
.frame.split_editorial{background:var(--navy)}.frame.split_editorial .photo{left:44%;}.frame.split_editorial .gloss{left:44%}.frame.split_editorial .scrim{background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 43%,rgba(11,23,35,.86) 50%,rgba(8,10,12,.08) 82%)}.frame.split_editorial .copy{width:520px;right:auto}.frame.split_editorial .headline{font-size:72px}.frame.split_editorial .support{font-size:24px}
.frame.object_led .photo{opacity:.34}.frame.object_led .object{display:block}.object{display:none;position:absolute;right:72px;top:215px;width:430px;height:700px;filter:drop-shadow(0 25px 45px rgba(0,0,0,.42))}.frame.object_led .copy{width:560px}.frame.object_led .headline{font-size:76px}
.frame.evidence_led .photo{opacity:.22}.frame.evidence_led .copy{width:510px}.frame.evidence_led .headline{font-size:70px}.frame.evidence_led .object{display:block;right:56px;top:180px;width:470px;height:850px;background-color:#F1EEE6;background-size:contain;background-repeat:no-repeat}
.frame.closing .scrim{background:linear-gradient(0deg,rgba(8,10,12,.86),rgba(11,23,35,.20) 56%,rgba(8,10,12,.06))}.frame.closing .copy{max-width:890px}.cta{display:{{cta_display}};margin-top:30px;color:var(--signal);font:800 20px/1.2 Manrope;text-transform:uppercase}.handle{display:{{cta_display}};margin-top:10px;color:var(--ivory);font:700 17px/1.2 Manrope;letter-spacing:.05em}

/* Carousel v2 candidate: identity placement retained; accents await visual approval. */
.page-spine{position:absolute;left:0;top:0;bottom:0;width:10px;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:0;z-index:5;background:rgba(241,238,230,.10)}
.page-spine i{display:block;min-height:0;background:transparent}
.frame[data-slide="1"] .page-spine i:nth-child(-n+1){background:var(--signal)}
.frame[data-slide="2"] .page-spine i:nth-child(-n+2){background:var(--signal)}
.frame[data-slide="3"] .page-spine i:nth-child(-n+3){background:var(--signal)}
.frame[data-slide="4"] .page-spine i:nth-child(-n+4){background:var(--signal)}
.frame[data-slide="5"] .page-spine i:nth-child(-n+5){background:var(--signal)}
.frame[data-slide="6"] .page-spine i:nth-child(-n+6){background:var(--signal)}
.frame[data-slide="7"] .page-spine i:nth-child(-n+7){background:var(--signal)}

/* Story role controls ending composition, even with legacy visual_mode payloads. */
.frame .cta,.frame .handle{display:none}
.frame .support:empty,.frame .mini:empty,.frame .kicker:empty{display:none}
.frame[data-slide] .photo,.frame[data-slide] .gloss{inset:0}
.frame[data-slide] .photo{opacity:1}
.frame[data-slide] .scrim{background:linear-gradient(0deg,rgba(8,10,12,.98) 0%,rgba(11,23,35,.85) 26%,rgba(8,10,12,.28) 53%,rgba(8,10,12,.08) 74%),linear-gradient(180deg,rgba(8,10,12,.65),transparent 18%)}
.frame[data-slide] .copy{left:58px;right:58px;width:auto;max-width:850px;bottom:108px}
.frame[data-slide] .headline{font-size:78px;line-height:.96}
.frame[data-slide] .support{font-size:26px;line-height:1.32;max-width:760px;margin-top:20px}
.frame[data-slide] .object{display:none}
.frame[data-slide="6"] .copy{bottom:150px;max-width:900px}
.frame[data-slide="6"] .headline{font-size:96px;line-height:.95}
.frame[data-slide="6"] .support{margin-top:30px;max-width:740px}
.frame[data-slide="6"] .mini{display:none}
.frame[data-slide="7"] .copy{bottom:146px;max-width:890px}
.frame[data-slide="7"] .headline{font-size:92px;line-height:.98}
.frame[data-slide="7"] .support{max-width:710px;margin-top:28px;font-size:28px}
.frame[data-slide="7"] .mini{display:none}
.frame[data-slide="7"] .handle{display:block;margin-top:42px;color:var(--signal);font:800 23px/1.25 Manrope;letter-spacing:0}
.frame[data-slide="7"] .handle:before{content:"";display:block;background:var(--gold);width:64px;height:2px;margin-bottom:24px}
.frame[data-slide="7"] .cta{display:block;margin-top:12px;color:var(--ivory);font:500 21px/1.3 Manrope;text-transform:none;letter-spacing:0}
.frame[data-slide="7"] .handle:empty,.frame[data-slide="7"] .cta:empty{display:none}
.source{right:58px;line-height:1.3;text-transform:none;letter-spacing:.01em}
/* v2.1 surgical review: larger type, cover hierarchy and publication footer. */
.top{top:56px;left:60px;right:60px;font-size:26px}
.kicker{font-size:27px;line-height:1.15;margin-bottom:24px}
.frame[data-slide] .copy{left:60px;right:60px;bottom:230px;max-width:950px}
.frame[data-slide] .headline{font-size:92px;line-height:.98}
.frame[data-slide] .support{font-size:32px;line-height:1.3;max-width:840px;margin-top:26px}
.frame[data-slide] .mini{font-size:26px}
.frame[data-slide="1"] .headline{font-size:116px;line-height:.93;letter-spacing:-.04em}
.frame[data-slide="1"] .copy{bottom:224px;max-width:960px}
.frame[data-slide="1"] .support{font-size:34px;max-width:850px;margin-top:30px}
.frame[data-slide="6"] .headline{font-size:106px;line-height:.94}
.frame[data-slide="6"] .support{font-size:32px;max-width:850px;margin-top:30px}
.frame[data-slide="7"] .headline{font-size:104px;line-height:.96}
.frame[data-slide="7"] .support{font-size:34px;max-width:860px}
.frame[data-slide="7"] .handle{font-size:30px;margin-top:34px}
.frame[data-slide="7"] .cta{font-size:27px;margin-top:14px}
.frame[data-slide="7"] .handle:before{width:90px;margin-bottom:20px}
.frame[data-slide] .scrim{background:linear-gradient(0deg,rgba(8,10,12,.99) 0%,rgba(11,23,35,.91) 32%,rgba(8,10,12,.30) 57%,rgba(8,10,12,.06) 78%),linear-gradient(180deg,rgba(8,10,12,.65),transparent 18%)}
.ghost-number{position:absolute;right:54px;bottom:110px;font:800 142px/1 Manrope;letter-spacing:-.06em;color:rgba(241,238,230,.09)}
.deck-name{position:absolute;left:60px;bottom:52px;color:var(--gold);font:800 25px/1.2 Manrope;letter-spacing:.055em}
.source{left:auto;right:60px;bottom:52px;width:510px;text-align:right;font-size:18px;line-height:1.25;color:rgba(241,238,230,.76)}

/* v2.4: source-specific compositions; approved cover and close unchanged. */
.frame.place .photo{background-size:auto 190%;background-position:65% 100%}
.frame.place .scrim{background:linear-gradient(0deg,rgba(8,10,12,.99),rgba(11,23,35,.88) 32%,rgba(8,10,12,.08) 62%),linear-gradient(180deg,rgba(8,10,12,.76),transparent 22%)}
.frame.book_detail .photo{background-size:auto 110%;background-position:48% 45%}
.frame.documentary .photo{inset:120px 0 auto;height:720px;background-size:cover;background-position:center}
.frame.documentary .gloss{display:none}
.frame.documentary .scrim{background:linear-gradient(180deg,#080A0C 0px,rgba(8,10,12,.20) 160px,transparent 240px,transparent 590px,rgba(8,10,12,.78) 760px,#080A0C 850px)}
.frame.documentary[data-slide="5"] .copy{bottom:230px}
.frame.documentary[data-slide="6"] .headline{font-size:96px;line-height:.94}
.frame.documentary[data-slide="6"] .copy{bottom:218px}
.frame.documentary[data-slide="6"] .scrim{background:linear-gradient(180deg,#080A0C 0px,rgba(8,10,12,.12) 140px,transparent 210px,transparent 470px,rgba(8,10,12,.88) 640px,#080A0C 810px)}

/* v2.5: Slide 6 typography is the shared deck treatment. */
.frame[data-slide] .copy{top:600px;bottom:auto;left:60px;right:60px;width:auto;max-width:950px}
.frame[data-slide] .headline{font:700 96px/.94 'Cormorant Garamond';letter-spacing:-.028em;max-width:950px}
.frame[data-slide] .kicker{font-size:27px;line-height:1.15;margin-bottom:24px}
.frame[data-slide] .support{font-size:32px;line-height:1.3;max-width:850px;margin-top:30px}
.frame.documentary[data-slide="5"] .scrim{background:linear-gradient(180deg,#080A0C 0px,rgba(8,10,12,.12) 140px,transparent 210px,transparent 470px,rgba(8,10,12,.88) 640px,#080A0C 810px)}
/* v2.6: lighter image scrim across the complete sequence. */
.frame[data-slide] .scrim{opacity:.78}
/* Semantic image binding v2; crop geometry v1; approved design tokens unchanged. */
.photo{overflow:hidden}.photo .image-layer{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--x) var(--y)}.object img{width:100%;height:100%;object-fit:contain}.frame.place .image-layer{object-position:65% 100%;transform:scale(1.9);transform-origin:65% 100%}.frame.book_detail .image-layer{object-position:48% 45%;transform:scale(1.1);transform-origin:48% 45%}.frame.documentary .image-layer{object-position:center}
</style></head><body><main class="frame {{visual_mode}}" data-slide="{{slide_number}}"><div class="photo"><img src="{{background_image}}" alt="" class="image-layer"></div><div class="gloss"></div><div class="scrim"></div><div class="object"></div><div class="page-spine" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><header class="top"><div class="brand">INTRST FILMS</div><div class="index">{{eyebrow}}</div></header><section class="copy"><div class="kicker">{{kicker}}</div><h1 class="headline">{{headline_html}}</h1><div class="support">{{support_copy}}</div><div class="mini">{{mini_hook}}</div><div class="handle">{{handle_text}}</div><div class="cta">{{cta_text}}</div></section><div class="ghost-number" aria-label="Slide {{slide_number}} of 7">0{{slide_number}}</div><div class="deck-name">{{deck_name}}</div><div class="source">{{source_line}}</div></main></body></html>
