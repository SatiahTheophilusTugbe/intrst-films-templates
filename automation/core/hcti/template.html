<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap');
    html, body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; }
    body { background: #101925; color: #f7f0df; font-family: Inter, sans-serif; }
    .frame { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
    .photo { position: absolute; inset: 0; background-image: url('{{subject_image}}'); background-position: {{image_position}}; background-size: cover; }
    .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16,25,37,.18), rgba(16,25,37,.88)); }
    .copy { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 64px 72px 56px; box-sizing: border-box; }
    .topbar, .footer { font: 600 24px/1.2 Manrope, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .topbar { display: flex; justify-content: space-between; color: #f7f0df; }
    .kicker { margin: auto 0 18px; color: #f4c96b; font: 600 24px/1.2 Manrope, sans-serif; }
    h1 { max-width: 900px; margin: 0 0 28px; font: 600 112px/.88 'Cormorant Garamond', serif; letter-spacing: -.025em; }
    h1 em { color: #f4c96b; font-style: normal; }
    .dek { max-width: 820px; margin: 0 0 28px; font: 500 30px/1.22 Inter, sans-serif; }
    .footer { color: #d3d9e2; font-size: 18px; }
  </style>
</head>
<body>
  <main class="frame">
    <div class="photo"></div>
    <div class="scrim"></div>
    <section class="copy">
      <div class="topbar"><span>{{subject}}</span><span>{{story_label}}</span></div>
      <div>
        <div class="kicker">{{kicker}}</div>
        <h1>{{headline_html}}</h1>
        <p class="dek">{{dek}}</p>
      </div>
      <div class="footer">{{source_line}}</div>
    </section>
  </main>
</body>
</html>
